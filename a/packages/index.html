<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Packages · Amigo Animation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../shared/site.css?v=1795817556">
<style>
/* signature: one plan card. Drag the days and the month fills with kit tiles in Amigo color. */
.plan{padding-top:clamp(28px,4vw,64px);padding-bottom:clamp(28px,4vw,64px);display:flex;justify-content:center}
.card{position:relative;width:100%;max-width:1120px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);background:var(--raise);border-radius:26px;
  -webkit-mask:radial-gradient(circle 17px at 45.4545% 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 17px at 45.4545% 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle 17px at 45.4545% 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 17px at 45.4545% 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
.cl{padding:clamp(24px,3.2vw,44px);display:flex;flex-direction:column;gap:18px;min-width:0;border-right:2px dashed #4A4845}
.cl .el{color:var(--dim)}
.cl h3{font-size:clamp(34px,4.2vw,60px)}
.price{display:flex;align-items:baseline;gap:10px;margin:0}
.price b{font:400 clamp(44px,5.4vw,78px)/1 Oaxaca,Impact,sans-serif;letter-spacing:.015em;color:var(--cream)}
.price span{color:var(--dim)}
.days{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.days label{display:flex;justify-content:space-between;align-items:baseline;font-weight:500}
.days output{font:400 30px/1 Oaxaca,Impact,sans-serif;color:var(--cream);min-width:2ch;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;margin:0;background:transparent;cursor:pointer;--f:20%}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--terra) var(--f),#4A4845 var(--f))}
input[type=range]::-moz-range-track{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--terra) var(--f),#4A4845 var(--f))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:-12px;border-radius:50%;background:var(--cream);border:0;transition:transform .35s var(--spring)}
input[type=range]::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:var(--cream);border:0}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.18)}
.inc{list-style:none;margin:0;padding:0;display:grid;gap:10px;color:var(--dim)}
.inc li{display:flex;align-items:center;gap:12px}
.inc li::before{content:"";flex:none;width:16px;height:16px;background:#6B6864;border-radius:8px 8px 0 0}
.inc li:nth-child(2)::before{border-radius:50%}.inc li:nth-child(3)::before{border-radius:0 100% 0 0}.inc li:nth-child(4)::before{border-radius:8px;height:8px}
.cl .btn{align-self:flex-start;margin-top:auto}
.cr{padding:clamp(24px,3.2vw,44px);display:flex;flex-direction:column;justify-content:center;gap:16px;min-width:0}
.cr .cap{display:flex;justify-content:space-between;gap:12px;color:var(--dim);flex-wrap:wrap}
.cr .cap b{color:var(--cream);font-weight:400}
.wk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));font-size:13px;color:var(--dim);text-align:center}
.month{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}
.day{aspect-ratio:1;background:#242322;position:relative;overflow:hidden;transition:background .3s}
.day i{position:absolute;background:#34322F;transition:inset .55s var(--spring),border-radius .55s var(--spring),background .3s,transform .55s var(--spring)}
.day i{inset:38%;border-radius:50%}
.day.on{background:var(--b)}.day.on i{background:var(--f)}
.day.on.disc i{inset:14%;border-radius:50%}
.day.on.arch i{inset:14% 14% 0 14%;border-radius:999px 999px 0 0}
.day.on.cap i{inset:30% 10%;border-radius:999px}
.day.on.q1 i{inset:0;border-radius:0 0 100% 0}
.day.on.q3 i{inset:0;border-radius:100% 0 0 0}
.day.on.h1 i{inset:50% 0 0 0;border-radius:999px 999px 0 0}
@media(max-width:760px){.card{grid-template-columns:minmax(0,1fr);-webkit-mask:none;mask:none}.cl{border-right:0;border-bottom:2px dashed #4A4845}}
</style>
</head>
<body>
<div id="page"></div>
<script src="../shared/data.js?v=1795817556"></script>
<script src="../shared/kit.js?v=1795817556"></script>
<script src="../shared/viewer.js?v=1795817556"></script>
<script src="../shared/spec.js?v=1795817556"></script>
<script>
const KINDS=['disc','arch','q1','cap','q3','h1','arch','disc','q3','cap','h1','q1','disc','q3','arch','cap','q1','disc','h1','arch'];
const AM=[['#BA6441','#F3E9DA'],['#291F18','#BA6441'],['#F3E9DA','#291F18'],['#BB6C2A','#291F18'],['#8E4427','#F3E9DA']];
const S=Spec.build({key:'packages',title:'PACKAGES',seed:21,
  reel:[{k:'ui',p:0},{k:'desert',p:0},{k:'orb',p:1}],
  sigTitle:'The plan',sigNote:'One card, one monthly price',
  sig:`<div class="plan pad"><div class="card" id="card">
    <div class="cl"><span class="el">The monthly team</span><h3>ONE PLAN</h3>
      <p class="price"><b>[Price]</b><span>a month</span></p>
      <div class="days"><label for="dy">Animation days a month <output id="dn" for="dy">8</output></label><input id="dy" type="range" min="4" max="20" step="2" value="8"></div>
      <ul class="inc"><li>[What is included]</li><li>[What is included]</li><li>[What is included]</li><li>[What is included]</li></ul>
      <a class="btn" href="../main/index.html#start">Start a project</a></div>
    <div class="cr"><div class="cap el"><span>One month of the team</span><span><b id="dc">8</b> of 20 working days</span></div>
      <div class="wk" aria-hidden="true"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span></div>
      <div class="month" id="month" role="img" aria-label="A month of working days, filled for the days chosen">${KINDS.map((k,i)=>`<div class="day ${k}" style="--b:${AM[(i*2+Math.floor(i/5))%5][0]};--f:${AM[(i*2+Math.floor(i/5))%5][1]}"><i></i></div>`).join('')}</div></div>
  </div></div>`,
  workNote:'Placeholder picks and drawn stand-ins',work:[Kit.WORK.airport,Kit.WORK.zebra_inventory,Kit.WORK.jiffy_hook,{k:'kit',p:0},Kit.WORK.jiffy_starborn,{k:'orb',p:1}]});
if(!S.simple){/* the signature section only runs with ?v=full */
/* the days spread through the month, so 8 days reads as two a week, not the first eight */
const rng=S.$('#dy'),days=S.$$('.day'),ORDER=[0,7,14,16,3,10,12,19,5,8,1,18,11,4,15,6,13,2,17,9];
function fill(n,stagger){rng.style.setProperty('--f',((n-4)/16*100)+'%');S.$('#dn').textContent=n;S.$('#dc').textContent=n;
  ORDER.forEach((d,k)=>{const el=days[d],on=k<n;if(el.classList.contains('on')===on)return;el.style.transitionDelay=el.firstChild.style.transitionDelay=stagger?(k*45)+'ms':'0ms';el.classList.toggle('on',on)})}
rng.addEventListener('input',()=>fill(+rng.value,false));fill(0,false);
Kit.once(S.$('#card'),()=>fill(+rng.value,true),.4);
}
</script>
<script src="../shared/nav.js?v=1795817556"></script>
</body>
</html>
