<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>3D · Amigo Animation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../shared/site.css?v=1795818542">
<style>
/* signature: the product shelf. It scrolls sideways; the product in the light turns and takes its color. */
.shelf{position:relative;padding-top:clamp(20px,3vw,40px)}
.rail{display:flex;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;cursor:grab;scroll-snap-type:x proximity;padding:0 calc(50% - var(--pw) / 2);--pw:clamp(190px,21vw,290px)}
.rail::-webkit-scrollbar{display:none}
.rail.drag{cursor:grabbing;scroll-snap-type:none}
.prod{flex:none;width:var(--pw);margin:0;scroll-snap-align:center;position:relative;display:flex;flex-direction:column;align-items:center}
.prod canvas{width:100%;aspect-ratio:10/13;pointer-events:none;transition:transform .5s var(--spring)}
.prod.lit canvas{transform:translateY(-6px) scale(1.06)}
.prod figcaption{order:3;margin-top:26px;padding:6px 14px 5px;border:1px solid var(--line);border-radius:4px;color:var(--dim);background:var(--deep);transition:background .22s,color .22s,border-color .22s,transform .45s var(--spring);position:relative}
.prod figcaption::before{content:"";position:absolute;left:50%;top:-13px;width:1px;height:12px;background:var(--line)}
.prod.lit figcaption{background:var(--terra);color:var(--cream);border-color:var(--terra);transform:translateY(3px)}
.plank{position:absolute;left:0;right:0;height:16px;background:#3A3836;border-top:2px solid #55524E;box-shadow:0 14px 24px rgba(0,0,0,.35);pointer-events:none}
.beam{position:absolute;left:50%;top:0;width:calc(var(--pw) * 1.5);margin-left:calc(var(--pw) * -.75);height:78%;background:linear-gradient(180deg,rgba(243,233,218,.11),rgba(243,233,218,0) 92%);clip-path:polygon(34% 0,66% 0,100% 100%,0 100%);pointer-events:none;--pw:clamp(190px,21vw,290px)}
.ctl{display:flex;justify-content:center;gap:12px;padding:26px 0 clamp(28px,4vw,48px)}
.ctl button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s,transform .4s var(--spring)}
.ctl button:hover{background:var(--terra);border-color:var(--terra);transform:scale(1.08)}.ctl button:active{transform:scale(.94)}
</style>
</head>
<body>
<div id="page"></div>
<script src="../shared/data.js?v=1795818542"></script>
<script src="../shared/kit.js?v=1795818542"></script>
<script src="../shared/viewer.js?v=1795818542"></script>
<script src="../shared/icons.js?v=1795818542"></script>
<script src="../shared/spec.js?v=1795818542"></script>
<script>
const ORDER=['cup','can','bottle','jar','vase','orb','spray','tin'];
const arrow=d=>`<svg width="18" height="14" viewBox="0 0 18 14" aria-hidden="true"><path d="${d?'M1 7h15M10 1l6 6-6 6':'M17 7H2M8 1L2 7l6 6'}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>`;
const S=Spec.build({key:'3d',title:'3D',seed:13,
  reel:[{k:'orb',p:1},{k:'spin',p:0},{k:'spin',p:2}],
  sigTitle:'The shelf',sigNote:'Scroll or drag sideways',
  sig:`<div class="shelf" id="shelf"><i class="beam" aria-hidden="true"></i><div class="rail" id="rail" tabindex="0" aria-label="Product shelf, scrolls sideways">${ORDER.map(k=>`<figure class="prod" data-k="${k}"><canvas role="img" aria-label="Drawn stand-in for a 3D product render"></canvas><figcaption class="el">[Product]</figcaption></figure>`).join('')}</div><i class="plank" id="plank" aria-hidden="true"></i>
    <div class="ctl"><button type="button" id="prev" aria-label="Previous product">${arrow(0)}</button><button type="button" id="next" aria-label="Next product">${arrow(1)}</button></div></div>`,
  workNote:'One placeholder pick, the rest drawn stand-ins',work:[Kit.WORK.airport,{k:'spin',p:0},{k:'spin',p:1},{k:'orb',p:0},{k:'spin',p:2},{k:'orb',p:1}]});
if(!S.simple){/* the signature section only runs with ?v=full */
const rail=S.$('#rail'),plank=S.$('#plank'),prods=S.$$('.prod').map((el,i)=>({el,cv:el.querySelector('canvas'),g:el.querySelector('canvas').getContext('2d'),pr:Kit.PROD[el.dataset.k],rot:i*1.7,sp:0,c:0,lit:false,dirty:true}));
let hover=null,seen=false;
function size(){const d=Math.min(2,devicePixelRatio||1);for(const P of prods){const w=Math.round(P.cv.clientWidth*d),h=Math.round(P.cv.clientHeight*d);if(w&&(P.cv.width!==w||P.cv.height!==h)){P.cv.width=w;P.cv.height=h}P.dirty=true}
  const c=prods[0].cv;plank.style.top=(c.offsetTop+rail.offsetTop+c.clientHeight*.93)+'px'}
function centered(){const m=rail.scrollLeft+rail.clientWidth/2;let best=null,bd=1e9;for(const P of prods){const d=Math.abs(P.el.offsetLeft+P.el.offsetWidth/2-m);if(d<bd){bd=d;best=P}}return best}
/* the product in the light spins up and takes its color; the rest slow down and go grey */
function frame(){requestAnimationFrame(frame);if(!seen)return;const lit=hover||centered();
  for(const P of prods){const on=P===lit;if(on!==P.lit){P.lit=on;P.el.classList.toggle('lit',on)}
    const tc=on?1:0,ts=on?.03:0;if(Math.abs(tc-P.c)>.003||Math.abs(P.sp)>.0004||on||P.dirty){P.c+=(tc-P.c)*.09;P.sp+=(ts-P.sp)*.05;if(!Kit.still)P.rot+=P.sp;else P.c=tc;
      const w=P.cv.width,h=P.cv.height;if(!w)continue;P.g.clearRect(0,0,w,h);Kit.lathe(P.g,w/2,h*.93,h*.86*P.pr.h/.92,P.pr,P.rot,P.c);P.dirty=false}}}
new ResizeObserver(size).observe(rail);size();requestAnimationFrame(frame);
prods.forEach(P=>{P.el.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')hover=P});P.el.addEventListener('pointerleave',()=>{if(hover===P)hover=null})});
const step=n=>{const P=centered(),i=Kit.clamp(prods.indexOf(P)+n,0,prods.length-1),t=prods[i].el;hover=null;rail.scrollTo({left:t.offsetLeft+t.offsetWidth/2-rail.clientWidth/2,behavior:Kit.still?'auto':'smooth'})};
S.$('#prev').addEventListener('click',()=>step(-1));S.$('#next').addEventListener('click',()=>step(1));
rail.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();step(1)}if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}});
/* drag with a mouse; touch scrolls on its own */
let drag=null;rail.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;drag={x:e.clientX,s:rail.scrollLeft,moved:false}});
addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>4&&!drag.moved){drag.moved=true;rail.classList.add('drag');hover=null}if(drag.moved)rail.scrollLeft=drag.s-dx});
addEventListener('pointerup',()=>{if(drag&&drag.moved){rail.classList.remove('drag');step(0)}drag=null});
/* the shelf slides in from the far end the first time it is seen */
rail.scrollLeft=rail.scrollWidth;
Kit.once(S.$('#sig'),()=>{seen=true;const t=prods[2].el;rail.scrollTo({left:t.offsetLeft+t.offsetWidth/2-rail.clientWidth/2,behavior:Kit.still?'auto':'smooth'})},.3);
}
</script>
<script src="../shared/nav.js?v=1795818542"></script>
</body>
</html>
